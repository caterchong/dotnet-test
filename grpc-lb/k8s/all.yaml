# gRPC Server Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-server
  namespace: default
  labels:
    app: grpc-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: grpc-server
  template:
    metadata:
      labels:
        app: grpc-server
    spec:
      # 设置终止宽限期为 30 秒，允许优雅关闭
      terminationGracePeriodSeconds: 30
      containers:
      - name: grpc-server
        image: grpc-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
        env:
        - name: PORT
          value: "50051"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - "sleep 10"
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-server
  namespace: default
  labels:
    app: grpc-server
spec:
  # Headless Service - 每个 Pod 都有独立的 DNS 记录
  # 格式: <pod-name>.<service-name>.<namespace>.svc.cluster.local
  clusterIP: None
  ports:
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  selector:
    app: grpc-server
---
# gRPC Client Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-client
  namespace: default
  labels:
    app: grpc-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-client
  template:
    metadata:
      labels:
        app: grpc-client
    spec:
      containers:
      - name: grpc-client
        image: grpc-client:latest
        imagePullPolicy: Never
        env:
        # 使用 DNS resolver 连接到 headless service
        - name: TARGET
          value: "dns:///grpc-server.default.svc.cluster.local:50051"
        - name: TEST_DURATION
          value: "3000"
        - name: REQUEST_INTERVAL
          value: "1000"
        command: ["dotnet", "GrpcClient.dll"]
        args:
        - "$(TARGET)"
        - "$(TEST_DURATION)"
        - "$(REQUEST_INTERVAL)"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
